name: Reservation preview on GitHub Pages

on:
  push:
    branches: [feat/reserve]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reserve-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /sneaky-geotam
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-preview/out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
